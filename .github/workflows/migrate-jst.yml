name: Migrate WMS Time to Japan

on:
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Back up and migrate WMS time on server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL || 'http://127.0.0.1:5002/health' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          envs: DEPLOY_SHA,HEALTH_URL
          script: |
            set -eu
            cd /var/www/api_wms
            if [ "$(git rev-parse HEAD)" != "$DEPLOY_SHA" ]; then
              echo '[jst] server commit differs from this workflow; aborting before downtime'
              exit 1
            fi
            FLASK_ENV=production SCHEDULER_ENABLED=False \
              python scripts/manual/migrate_jst.py --apply --health-url "$HEALTH_URL"
